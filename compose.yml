services:
  api:
    image: go-learning-app-api:${IMAGE_TAG:-dev}
    build:
      context: .
      target: api
      args:
        IMAGE_VERSION: ${IMAGE_TAG:-dev}
        VCS_REVISION: ${VCS_REVISION:-unknown}
        BUILD_DATE: ${BUILD_DATE:-unknown}
        SOURCE_URL: ${SOURCE_URL:-https://github.com/doryosi/go-learning-app}
    environment:
      PORT: "8080"
    ports:
      - "8080:8080"
    init: true

  worker:
    image: go-learning-app-worker:${IMAGE_TAG:-dev}
    build:
      context: .
      target: worker
      args:
        IMAGE_VERSION: ${IMAGE_TAG:-dev}
        VCS_REVISION: ${VCS_REVISION:-unknown}
        BUILD_DATE: ${BUILD_DATE:-unknown}
        SOURCE_URL: ${SOURCE_URL:-https://github.com/doryosi/go-learning-app}
    init: true
