services:
  api:
    image: go-learning-app-api:${IMAGE_TAG:-dev}
    build:
      context: .
      target: api
    environment:
      PORT: "8080"
    ports:
      - "8080:8080"
    init: true

  worker:
    image: go-learning-app-worker:${IMAGE_TAG:-dev}
    build:
      context: .
      target: worker
    init: true
